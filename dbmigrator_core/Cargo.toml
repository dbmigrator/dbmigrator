[package]
name = "dbmigrator_core"
version = "0.5.0"
edition = "2021"
description = "Core recipe loading and parsing for the dbmigrator crate"
authors = ["Przemyslaw Sztoch <przemyslaw@sztoch.pl>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dbmigrator/dbmigrator"

[dependencies]
regex = "1"
thiserror.workspace = true
walkdir = "2.4"
sha2 = "0.10"
version-compare = "0.2.0"

[dev-dependencies]
tempfile = "3"
