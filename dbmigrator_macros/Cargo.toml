[package]
name = "dbmigrator_macros"
version = "0.4.7-alpha"
edition = "2021"
description = "Procedural macros for the dbmigrator crate"
authors = ["Przemyslaw Sztoch <przemyslaw@sztoch.pl>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dbmigrator/dbmigrator"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
syn = { version = "2", default-features = false, features = ["parsing", "proc-macro"] }
quote = "1.0.37"
regex = "1.11.1"
dbmigrator_core = { version = "0.4.7-alpha", path = "../dbmigrator_core" }
